services:
  backend:
    build: .
    container_name: knowledge-assistant-api
    command: >
      uvicorn app:app
      --host 0.0.0.0
      --port 8000
      --reload
    ports:
      - "8000:8000"
    volumes:
      - chroma_data:/app/chroma_db
      - uploads_data:/app/uploads
    environment:
      PYTHONPATH: /app
    env_file:
      - .env
    healthcheck:
      test: [ "CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/')" ]
      interval: 10s
      timeout: 10s
      retries: 10

  frontend:
    depends_on:
      backend:
        condition: service_healthy
    build: .
    container_name: knowledge-assistant-ui
    command: >
      streamlit run streamlit_app.py
      --server.address 0.0.0.0
      --server.port 8501
      --server.fileWatcherType none
    ports:
      - "8501:8501"
    environment:
      API_BASE_URL: http://backend:8000
    env_file:
      - .env

volumes:
  chroma_data:
  uploads_data: