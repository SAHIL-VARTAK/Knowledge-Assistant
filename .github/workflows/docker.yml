name: Docker

on:
  workflow_dispatch:

  push:
    branches:
      - main
      - develop
      - feature/**
      - task/**

  pull_request:
    branches:
      - main
      - develop

jobs:
  docker:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Create empty .env
        run: |
          touch .env

      - name: Build Docker images
        run: |
          docker compose build

      - name: Start services
        run: |
          docker compose up -d

      - name: Wait for backend
        run: |
          timeout 120 bash -c '
          until curl -f http://localhost:8000; do
            echo "Waiting for backend..."
            sleep 5
          done
          '

      - name: Wait for Streamlit
        run: |
          timeout 120 bash -c '
          until curl -fs http://localhost:8501/_stcore/health; do
            echo "Waiting for Streamlit..."
            sleep 5
          done
          '

      - name: Show logs on failure
        if: failure()
        run: |
          docker compose logs

      - name: Cleanup
        if: always()
        run: |
          docker compose down -v