[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = [
    "E",   # pycodestyle
    "F",   # pyflakes
    "I",   # import sorting
    "UP",  # pyupgrade
    "B"    # flake8-bugbear
]

ignore = [
    "E501"
]

[tool.ruff.lint.per-file-ignores]
"services/embeddings.py" = ["E402"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]

addopts = """
--cov=.
--cov-report=term-missing
--cov-report=html:reports/coverage/html
--cov-report=xml:reports/coverage/coverage.xml
"""

[tool.coverage.run]
source = [
    "."
]
omit = [
    "tests/*",
    "venv/*",
    ".venv/*",
    "reports/*",
]
