[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = [
    "E",   # pycodestyle
    "F",   # pyflakes
    "I",   # import sorting
    "UP",  # pyupgrade
    "B"    # flake8-bugbear
]

ignore = [
    "E501"
]

[tool.ruff.lint.per-file-ignores]
"services/embeddings.py" = ["E402"]